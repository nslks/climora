version: "3.9"

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: climora-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  influxdb:
    image: influxdb:2.7
    container_name: climora-influxdb
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: ${INFLUXDB_INIT_MODE}
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_INIT_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_INIT_PASSWORD}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_INIT_BUCKET}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_INIT_ORG}
    volumes:
      - influxdb-data:/var/lib/influxdb2

  data_collector:
    image: python:3.11-slim
    container_name: climora-data-collector
    depends_on:
      - mosquitto
      - influxdb
    env_file:
      - .env
    working_dir: /app
    volumes:
      - ./:/app
    command: >
      bash -c "
      pip install --no-cache-dir -r services/data_collector/requirements.txt &&
      python -m services.data_collector
      "

volumes:
  mosquitto-data:
  mosquitto-log:
  influxdb-data:
  influxdb-config:

