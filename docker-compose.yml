services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: climora-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  ollama:
    extends:
      file: ./infrastructure/ollama/docker-compose.ollama.yml
      service: ollama

  ntfy:
    extends:
      file: ./infrastructure/ntfy/docker-compose.ntfy.yml
      service: ntfy

  ai_service:
    build:
      context: ./services/ai_service
      dockerfile: Dockerfile
    container_name: climora-ai-service
    depends_on:
      - ollama
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "8003:8003"
    volumes:
      - ./shared:/app/shared

  processor:
    build:
      context: ./services/processor
      dockerfile: Dockerfile
    container_name: climora-processor
    depends_on:
      - ai_service
      - ntfy
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "8004:8004"
    volumes:
      - ./shared:/app/shared

  data_collector:
    build:
      context: ./services/data_collector
      dockerfile: Dockerfile
    container_name: climora-data-collector
    depends_on:
      - mosquitto
      - processor
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./shared:/app/shared


volumes:
  mosquitto-data:
  mosquitto-log:
  ollama-data:
