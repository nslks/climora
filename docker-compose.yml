version: "3.9"

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: climora-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  influxdb:
    image: influxdb:2.7
    container_name: climora-influxdb
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: ${INFLUXDB_MODE}
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_TOKEN: ${INFLUXDB_API_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2

  db_service:
    build:
      context: ./services/db_service
      dockerfile: Dockerfile
    container_name: climora-db-service
    depends_on:
      - influxdb
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      - ./shared:/app/shared

  data_collector:
    build:
      context: ./services/data_collector
      dockerfile: Dockerfile
    container_name: climora-data-collector
    depends_on:
      - mosquitto
      - db_service
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./shared:/app/shared  # wichtig, damit das geteilte Modell importiert werden kann


volumes:
  mosquitto-data:
  mosquitto-log:
  influxdb-data:
  influxdb-config:
