version: "3.9"

services:
  influxdb:
    image: influxdb:2.7
    container_name: climora-influxdb
    restart: unless-stopped
    env_file:
      - ./influxsecrets
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://localhost:8086"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
